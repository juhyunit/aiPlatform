# 정책 — 데이터 등급, 실행 환경별 상한, 한도, 하네스 스위치
# 등급 설명과 분류 기준은 docs/data-grades.md. 정보보호 부서가 확정하기 전까지는 초안이다.

# 데이터 등급. 낮은 순서이고, 순번(0~4)이 DB에 저장되는 값이다.
grades: [public, internal, restricted, pseudonymized, personal]

# 실행 환경이 받을 수 있는 최고 등급. 모델의 clearance가 더 높아도 이 값을 넘지 못한다.
env_max:
  internal: personal
  external: public   # 대체 통제·개별 승인·혁신금융 지정 결과에 따라 올린다. personal은 올릴 수 없다(현행)

# 추적 기록과 감사 로그를 저장하기 전에 가리는 패턴
mask:
  - '(?<!\d)\d{6}-?[1-8]\d{6}(?!\d)'                         # 주민등록번호·외국인등록번호
  - '(?<!\d)\d{4}[- ]\d{4}[- ]\d{4}[- ]\d{4}(?!\d)'          # 카드번호
  - '(?<!\d)0\d{1,2}[- ]\d{3,4}[- ]\d{4}(?!\d)'              # 전화번호
  - '(?<!\d)\d{2,6}-\d{2,6}-\d{2,8}(?:-\d{1,3})?(?!\d)'      # 계좌번호(구분자 있음)
  - '(?<!\d)\d{10,16}(?!\d)'                                 # 계좌·카드번호(구분자 없음)

# 아래 숫자는 출발값이다. 2단계에서 실측한 뒤 고친다.
limits:
  concurrent_requests: 2      # 사용자 한 명의 동시 요청 수
  daily_tokens: 2000000       # 사용자 한 명의 하루 토큰
  agent_concurrency: 2        # 워커가 동시에 돌리는 Agent 작업 수
  upload_mb: 50

max_output: {quick: 1024, thinking: 2048, agent: 2048}   # 모드별 최대 출력 토큰

budget:                       # Agent 작업 하나의 예산
  fixes_per_step: 2
  minutes: 30
  tokens: 400000

# 하네스 기법 스위치. 2단계에서 켠 경우와 끈 경우의 평가 점수를 비교하고, 효과가 없으면 코드째 지운다.
harness:
  keyword_search: true        # 형태소 키워드 검색을 밀집 검색과 함께 사용
  compression: true           # 대화 이력 요약 압축
  state_reinjection: true     # 작업 상태를 매 호출 끝에 다시 넣기
  reviewer: true              # Agent 검증 단계의 LLM 검토
  number_check: true          # 답의 수치가 자료나 실행 결과에 있는지 확인

# 업무 유형별 합격선. 1단계 말에 기준선을 잰 뒤 기입한다. 없는 유형은 0으로 본다.
pass_line: {}
